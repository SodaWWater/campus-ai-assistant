services:
  mysql:
    image: mysql:8.0
    container_name: campus-ai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_ai
      MYSQL_USER: campus_ai
      MYSQL_PASSWORD: campus_ai
      LANG: C.UTF-8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: campus-ai-pgvector
    environment:
      POSTGRES_DB: campus_ai_vector
      POSTGRES_USER: campus_ai
      POSTGRES_PASSWORD: campus_ai
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: campus-ai-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: campus-ai-rabbitmq
    ports:
      - "5572:5672"
      - "15672:15672"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-ai-app
    ports:
      - "${SERVER_PORT:-8081}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JWT_SECRET=${JWT_SECRET:-campus-ai-assistant-demo-secret-key-change-me-2026}
      - MYSQL_URL=jdbc:mysql://mysql:3306/campus_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - VECTOR_DB_URL=jdbc:postgresql://pgvector:5432/campus_ai_vector
      - VECTOR_DB_USERNAME=campus_ai
      - VECTOR_DB_PASSWORD=campus_ai
      - LLM_MODE=mock
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
