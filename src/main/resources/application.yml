server:
  port: ${SERVER_PORT:8081}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
  application:
    name: campus-ai-assistant
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/campus_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5572}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  ai:
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

llm:
  mode: ${LLM_MODE:mock}
  provider: deepseek
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}

app:
  cache:
    knowledge-base-list-ttl-minutes: 1
    faq-ttl-minutes: 5
    context-ttl-hours: 1
  vector:
    enabled: ${VECTOR_SEARCH_ENABLED:true}
    dimension: ${VECTOR_DIMENSION:128}
    jdbc-url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5433/campus_ai_vector}
    username: ${VECTOR_DB_USERNAME:campus_ai}
    password: ${VECTOR_DB_PASSWORD:campus_ai}
  mq:
    document-exchange: campus.ai.document.exchange
    document-routing-key: document.process
    document-queue: campus.ai.document.process.queue
    dlx-exchange: campus.ai.document.dlx.exchange
    dlx-routing-key: document.dlq
    dlq-queue: campus.ai.document.dlq.queue
    max-retry-count: 3
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    general-rpm: 100
    chat-rpm: 10
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    export:
      simple:
        enabled: true

info:
  app:
    name: campus-ai-assistant
    version: 0.0.1-SNAPSHOT
    description: Campus AI Knowledge Hub

springdoc:
  swagger-ui:
    path: /swagger-ui.html
