server:
  port: 8081

spring:
  application:
    name: campus-ai-assistant
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/campus_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5572}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  ai:
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:dummy-key-for-mock-mode}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

llm:
  mode: mock
  provider: deepseek
  base-url: https://api.deepseek.com
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat

app:
  cache:
    knowledge-base-list-ttl-minutes: 10
    faq-ttl-minutes: 30
    context-ttl-hours: 2
  mq:
    document-exchange: campus.ai.document.exchange
    document-routing-key: document.process
    document-queue: campus.ai.document.process.queue

springdoc:
  swagger-ui:
    path: /swagger-ui.html
