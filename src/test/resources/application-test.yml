spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  sql:
    init:
      mode: never
  redis:
    host: localhost
    port: 6379
  rabbitmq:
    host: localhost
    port: 5672
  ai:
    openai:
      api-key: test-key

llm:
  mode: mock

app:
  jwt:
    secret: test-jwt-secret-for-unit-tests-only-32chars
  vector:
    enabled: false
  rate-limit:
    enabled: false
